<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#231F20"/>
      <stop offset="100%" stop-color="#121011"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
  </defs>
  <!-- Fundo Circular de Luxo -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.4"/>
  
  <!-- Monograma Serifado Editorial 'GA' -->
  <text x="256" y="325" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="230" font-weight="600" font-style="italic" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">GA</text>
  
  <!-- Detalhe de Estrela / Ponto de Luz nobre -->
  <circle cx="256" cy="380" r="6" fill="url(#goldGrad)"/>
</svg>